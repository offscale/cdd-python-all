name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      petstore-oas3:
        image: openapitools/openapi-petstore
        ports:
          - 8081:8080
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Checkout Test Harness
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/cdd-openapi-test-harness
        path: cdd-openapi-test-harness
    - name: Install dependencies
      run: |
        pip install uv
        make install_deps
    - name: Run pre-commit hooks
      env:
        TEST_HARNESS_DIR: ${{ github.workspace }}/cdd-openapi-test-harness
        RUN_SLOW_TESTS: 1
      run: |
        uv tool install pre-commit --with pre-commit-uv
        pre-commit run --all-files
    - name: Test
      run: make test
    - name: Build
      run: make build
    - name: Install binaryen
      run: sudo apt-get update && sudo apt-get install -y binaryen
    - name: Build WASM
      run: |
        make build_wasm
        for f in bin/*.wasm; do
          if [ -f "$f" ]; then
            wasm-opt -O3 "$f" -o "$f" || true
            cp "$f" dist/
          fi
        done
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-build
        path: dist/

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: python-build
        path: dist/
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/**/*
